spring.application.name=demo
spring.jpa.open-in-view=false

# ============================================================
# Conexão com o banco de dados
# Desenvolvimento local: H2 em arquivo (dados persistem entre reinícios).
# Produção: defina DB_URL (jdbc:postgresql://...), DB_DRIVER=org.postgresql.Driver,
#           DB_USER e DB_PASSWORD como variáveis de ambiente.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/techocean;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (apenas depuração local) -> /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console